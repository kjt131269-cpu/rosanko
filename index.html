<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로산꼬 전국일주</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#0E1F33;color:#F7F2E7;font-family:'Gothic A1',sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.wrap{width:100%;max-width:440px;display:flex;flex-direction:column;flex:1;min-height:0;gap:8px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand{font-family:'Black Han Sans',sans-serif;font-size:18px;color:#FFC53D;white-space:nowrap}
.count{font-size:13px;color:#8FA3B8;white-space:nowrap}
.count b{color:#FFC53D;font-weight:700}
.bar{height:4px;background:#1B3A57;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:#1D8A7A;width:0;transition:width .5s ease}

.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:#54708F}
.dot{width:7px;height:7px;border-radius:50%;background:#54708F;flex:0 0 auto}
.dot.ok{background:#1D8A7A}.dot.off{background:#E08A2E}.dot.err{background:#EF5B34}

.tabs{display:flex;gap:6px}
.tab{flex:1;padding:9px 4px;border:none;border-radius:9px;background:#16304B;color:#8FA3B8;
  font-family:'Gothic A1',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.tab[aria-selected="true"]{background:#FFC53D;color:#0E1F33}

.view{display:none;flex:1;min-height:0;flex-direction:column;gap:8px}
.view.on{display:flex}

/* ---------- 룰렛 ---------- */
.steps{display:flex;gap:6px}
.step{flex:1;text-align:center;font-size:12px;color:#54708F;padding:6px 2px;border-radius:8px;background:#16304B}
.step.on{color:#0E1F33;background:#FFC53D;font-weight:700}
.step.did{color:#1D8A7A;background:#16304B}
.step.jj{color:#0E1F33;background:#1D8A7A;font-weight:700}

.stage{flex:1 1 auto;min-height:110px;display:flex;align-items:center;justify-content:center}
svg{height:100%;width:100%;max-height:100%;display:block}
#wheelG{transform-origin:50% 50%;transition:transform 4.6s cubic-bezier(.16,.72,.14,1)}
@media (prefers-reduced-motion:reduce){#wheelG{transition:transform .9s ease-out}}

.readout{flex:0 0 auto;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-family:'Black Han Sans',sans-serif;font-size:clamp(25px,7.2vw,40px);line-height:1.1;color:#F7F2E7}
.big.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.72);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.big.pop{animation:none}}
.hint{font-size:13px;color:#8FA3B8;margin-top:5px;line-height:1.45}

.jeju{flex:0 0 auto;display:none;width:100%;padding:11px;border:none;border-radius:12px;background:#1D8A7A;color:#fff;font-family:'Black Han Sans',sans-serif;font-size:16px;cursor:pointer}
.jeju.show{display:block}

.actions{flex:0 0 auto;display:flex;gap:8px}
.go{flex:2;padding:14px;border:none;border-radius:12px;background:#EF5B34;color:#fff;font-family:'Black Han Sans',sans-serif;font-size:19px;cursor:pointer}
.go:disabled{opacity:.4}
.again{flex:1;padding:14px 4px;border:2px solid #2C4260;border-radius:12px;background:transparent;color:#8FA3B8;font-family:'Gothic A1',sans-serif;font-size:14px;font-weight:700;cursor:pointer}

details{flex:0 0 auto;border-top:1px solid #1B3A57;padding-top:7px}
summary{font-size:13px;color:#8FA3B8;cursor:pointer;list-style:none;padding:3px 0}
summary::-webkit-details-marker{display:none}
summary::after{content:" 열기";color:#54708F}
details[open] summary::after{content:" 닫기"}
.panel{padding-top:10px;display:flex;flex-direction:column;gap:12px}
.skip{display:flex;align-items:center;gap:8px}
.skip span{font-size:12px;color:#54708F;white-space:nowrap}
.skip button{flex:1;padding:9px 4px;border:1px solid #2C4260;border-radius:9px;background:transparent;color:#8FA3B8;font-family:'Gothic A1',sans-serif;font-size:13px;cursor:pointer}
.logtop{display:flex;align-items:baseline;justify-content:space-between}
.logtop h2{font-size:14px;font-weight:700}
.wipe{background:none;border:none;color:#8FA3B8;font-family:'Gothic A1',sans-serif;font-size:13px;text-decoration:underline;cursor:pointer;padding:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:22vh;overflow-y:auto}
.chip{background:#1B3A57;color:#B8C9DA;border-radius:16px;padding:5px 11px;font-size:13px}
.chip.j{background:#1D8A7A;color:#EAF7F4}
.empty{font-size:13px;color:#54708F;line-height:1.5}
.note{font-size:12px;color:#54708F;line-height:1.5}

/* ---------- 포인트 ---------- */
#vPoints{overflow-y:auto;gap:10px}
.kid{border:1px solid #1B3A57;border-left-width:6px;border-radius:13px;padding:15px 14px;background:#142C48;margin-bottom:10px}
.kid.sel{border-color:#FFC53D;border-left-width:6px;background:#183353}
.krow{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.kname{font-family:'Black Han Sans',sans-serif;font-size:26px;color:#FFFFFF;letter-spacing:.01em}
.kpts{font-family:'Black Han Sans',sans-serif;font-size:32px;color:#FFC53D;line-height:1}
.kmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#C3D4E4;font-weight:700;margin:11px 0 7px}
.kmeta .nxt{color:#8FA3B8;font-weight:400;text-align:right}
.kbar{height:20px;background:#0A1929;border-radius:10px;overflow:hidden;position:relative}
.kbar i{display:block;height:100%;border-radius:10px;transition:width .45s ease}
.acts{display:none;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid #1B3A57}
.kid.sel .acts{display:flex}
.acts button{padding:11px 12px;border:1px solid #2C4260;border-radius:9px;background:transparent;
  color:#C3D4E4;font-family:'Gothic A1',sans-serif;font-size:14px;font-weight:700;cursor:pointer}
.acts button.plus{border-color:#2E5C4E;color:#7BC4AC}
.acts button.chief{border-color:#FFC53D;color:#FFC53D}
.acts button.minus{border-color:#5C3A34;color:#E0917E}
.acts .lbl{width:100%;font-size:11px;color:#54708F;margin-top:5px}
.undo{width:100%;padding:11px;border:1px solid #2C4260;border-radius:11px;background:transparent;
  color:#8FA3B8;font-family:'Gothic A1',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.lastline{font-size:12px;color:#54708F;text-align:center;line-height:1.5}

button:focus-visible,summary:focus-visible{outline:2px solid #3E8DDD;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="brand">로산꼬 전국일주</span>
    <span class="count">도장깨기 <b id="cDone">0</b> / <span id="cAll">67</span></span>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">연결 중</span></div>

  <div class="tabs" role="tablist">
    <button class="tab" id="tWheel"  role="tab" aria-selected="true">룰렛</button>
    <button class="tab" id="tPoints" role="tab" aria-selected="false">대장 포인트</button>
  </div>

  <!-- ===== 룰렛 ===== -->
  <div class="view on" id="vWheel" role="tabpanel">
    <div class="steps">
      <span class="step on" id="s1">1 거리</span>
      <span class="step" id="s2">2 권역</span>
      <span class="step" id="s3">3 도시</span>
    </div>

    <div class="stage">
      <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="wt">
        <title id="wt">목적지 룰렛</title>
        <g id="wheelG"></g>
        <circle cx="200" cy="200" r="34" fill="#0E1F33" stroke="#FFC53D" stroke-width="3"/>
        <text x="200" y="207" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="17" fill="#FFC53D">로산꼬</text>
        <polygon points="200,14 187,44 213,44" fill="#FFC53D"/>
      </svg>
    </div>

    <div class="readout">
      <div class="big" id="out">불러오는 중</div>
      <div class="hint" id="hint">잠시만 기다려주세요</div>
    </div>

    <button class="jeju" id="jeju">제주 특별전이 열렸습니다</button>

    <div class="actions">
      <button class="go" id="go" disabled>돌리기</button>
      <button class="again" id="rst">처음부터</button>
    </div>

    <details>
      <summary>설정과 다녀온 곳</summary>
      <div class="panel">
        <div class="skip">
          <span>거리 직접 정하기</span>
          <button id="fDay">당일치기</button>
          <button id="fNight">1박 2일</button>
        </div>
        <p class="note" id="jNote"></p>
        <div>
          <div class="logtop">
            <h2>다녀온 곳</h2>
            <button class="wipe" id="wipe">전부 지우기</button>
          </div>
          <div class="chips" id="chips" style="margin-top:9px"></div>
        </div>
      </div>
    </details>
  </div>

  <!-- ===== 포인트 ===== -->
  <div class="view" id="vPoints" role="tabpanel">
    <div id="kids"></div>
    <button class="undo" id="undo">마지막 기록 취소</button>
    <p class="lastline" id="lastLine"></p>
    <details>
      <summary>보상 교환표</summary>
      <div class="panel">
        <p class="note">
          20점 음악 선택권 + 디저트 지정<br>
          40점 저녁 메뉴 지정권<br>
          60점 집안일 일주일 면제<br>
          80점 친구 초대해서 놀기<br>
          100점 부모님과 단둘이 하루<br>
          120점 제주 특별전 대장 확정권<br>
          150점 편집용 노트북<br><br>
          보상을 쓰면 그만큼 점수가 빠집니다.<br>
          벌칙은 미리 정해둔 규칙을 어겼을 때만 쓰시고,<br>
          그날 기분으로 깎지는 마세요.
        </p>
        <button class="wipe" id="pwipe" style="text-align:left">포인트 전부 초기화</button>
      </div>
    </details>
  </div>

</div>
<p class="sr" aria-live="polite" id="live"></p>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

/* ============================================================
   설정 — Supabase 값을 여기에 붙여넣으세요
   URL 은 https://xxxx.supabase.co 형태입니다 (/rest/v1 붙이지 마세요)
   ============================================================ */
const SUPABASE_URL = "여기에_PROJECT_URL_붙여넣기";
const SUPABASE_KEY = "여기에_PUBLISHABLE_KEY_붙여넣기";
const FAMILY_ID    = "rosanko";
/* ============================================================ */

const DATA = {
  day: {
    "경기 북부": ["파주","가평","포천","남양주","양평","연천"],
    "경기 남부": ["수원","용인","안성","이천","여주","화성"],
    "인천 서해": ["인천","강화도","김포","대부도","시흥"],
    "강원 영서": ["춘천","홍천","원주","횡성","철원"],
    "충청 북부": ["충주","제천","단양","청주","괴산"],
    "충청 남부": ["대전","천안","아산","공주","예산","세종"]
  },
  night: {
    "강원 영동": ["강릉","속초","양양","동해","삼척","평창"],
    "충남 서해": ["태안","보령","서산","당진","서천"],
    "전라 북부": ["전주","군산","부안","고창","남원"],
    "전라 남부": ["광주","여수","순천","담양","목포","보성"],
    "경상 북부": ["대구","경주","안동","포항","영주","문경"],
    "경상 남부": ["울산","부산","통영","거제","남해","진주"]
  }
};
const JEJU  = ["제주시","서귀포","성산·우도","애월·한림","중문","표선·남원"];
const STEP  = 10;
const LABEL = { day: "당일치기", night: "1박 2일" };
const HUE   = ["#EF5B34","#FFC53D","#1D8A7A","#3E8DDD","#8B5CB8","#E08A2E"];
const JHUE  = ["#1D8A7A","#3E8DDD","#2FA890","#4E7FC7","#1F9B84","#5B93D6"];
const CACHE = "rosanko-cache-v4";

const KIDS = [
  { key: "roa",   name: "로하", color: "#EF5B34" },
  { key: "santa", name: "산타", color: "#FFC53D" },
  { key: "kkoma", name: "꼬마", color: "#3E8DDD" }
];
const EARN = [
  { d: 2, label: "참여" },
  { d: 3, label: "촬영" },
  { d: 4, label: "썸네일" },
  { d: 5, label: "편집" },
  { d: 3, label: "평점 4.0" },
  { d: 6, label: "평점 4.5" },
  { d: 3, label: "예산 남김" }
];
const SPEND = [20, 40, 60, 80, 100, 120, 150];
const EXTRA = [
  { d:  5, label: "보상", cls: "plus"  },
  { d: -5, label: "벌칙", cls: "minus" }
];
const TIERS = [20, 40, 60, 80, 100, 120, 150];

const $ = id => document.getElementById(id);
const G = $("wheelG"), OUT = $("out"), HINT = $("hint"), GO = $("go"), LIVE = $("live");
const S1 = $("s1"), S2 = $("s2"), S3 = $("s3");
const CHIPS = $("chips"), BAR = $("barFill"), CD = $("cDone"), CA = $("cAll");
const JBTN = $("jeju"), JNOTE = $("jNote"), DOT = $("dot"), STXT = $("syncTxt");
const KIDBOX = $("kids"), LASTLINE = $("lastLine");

const blankPoints = () => Object.fromEntries(KIDS.map(k => [k.key, { pts: 0, chief: 0 }]));
let store = { cities: [], regions: [], jeju: [], points: blankPoints(), hist: [] };
let stage = "dist", mode = "", region = "", turn = 0, spinning = false;
let sb = null, online = false, selected = null;

/* ---------- 저장 ---------- */
function normalize(p){
  const out = blankPoints();
  for (const k of KIDS){
    const v = (p && p[k.key]) || {};
    out[k.key] = { pts: Number(v.pts) || 0, chief: Number(v.chief) || 0 };
  }
  return out;
}
function adopt(d){
  store = {
    cities: d.cities || [], regions: d.regions || [], jeju: d.jeju || [],
    points: normalize(d.points), hist: d.hist || []
  };
}
function cacheWrite(){ try { localStorage.setItem(CACHE, JSON.stringify(store)); } catch(e){} }
function cacheRead(){ try { const r = localStorage.getItem(CACHE); if (r) adopt(JSON.parse(r)); } catch(e){} }
function setSync(cls, txt){ DOT.className = "dot " + cls; STXT.textContent = txt; }

async function pull(){
  const { data, error } = await sb.from("rosanko_state").select("*").eq("id", FAMILY_ID).maybeSingle();
  if (error){ setSync("err", "연결 실패 — 이 기기에만 저장됩니다"); return false; }
  if (data) adopt(data);
  else {
    await sb.from("rosanko_state").insert({ id: FAMILY_ID, cities: [], regions: [], jeju: [], points: blankPoints(), hist: [] });
    store = { cities: [], regions: [], jeju: [], points: blankPoints(), hist: [] };
  }
  cacheWrite(); online = true;
  setSync("ok", "모든 기기에서 같은 기록");
  return true;
}

let pushTimer = null;
function persist(){
  cacheWrite();
  if (!sb || !online) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    const { error } = await sb.from("rosanko_state").upsert({
      id: FAMILY_ID,
      cities: store.cities, regions: store.regions, jeju: store.jeju,
      points: store.points, hist: store.hist.slice(-30),
      updated_at: new Date().toISOString()
    });
    setSync(error ? "err" : "ok", error ? "저장 실패 — 다시 시도합니다" : "모든 기기에서 같은 기록");
    if (error) setTimeout(persist, 4000);
  }, 350);
}

/* ---------- 룰렛 로직 ---------- */
const freeCities  = (m,r) => DATA[m][r].filter(c => !store.cities.includes(c));
const liveRegions = m => Object.keys(DATA[m]).filter(r => freeCities(m,r).length > 0);
function freeRegions(m){
  const live = liveRegions(m);
  const fresh = live.filter(r => !store.regions.includes(r));
  if (fresh.length === 0 && live.length > 0){
    store.regions = store.regions.filter(r => !live.includes(r));
    persist();
    return live;
  }
  return fresh;
}
const freeModes = () => ["day","night"].filter(m => liveRegions(m).length > 0);
const freeJeju  = () => JEJU.filter(j => !store.jeju.includes(j));
const jejuReady = () => Math.floor(store.cities.length / STEP) > store.jeju.length && freeJeju().length > 0;
const toNextJeju = () => (Math.floor(store.cities.length / STEP) + 1) * STEP - store.cities.length;

function list(){
  if (stage === "jeju")   return freeJeju();
  if (stage === "dist")   return freeModes().map(m => LABEL[m]);
  if (stage === "region") return freeRegions(mode);
  return freeCities(mode, region);
}
const hues = () => stage === "jeju" ? JHUE : HUE;

/* ---------- 포인트 ---------- */
function nextTier(p){ return TIERS.find(t => t > p) || null; }

function renderKids(){
  const maxPts = Math.max(150, ...KIDS.map(k => store.points[k.key].pts));
  KIDBOX.innerHTML = KIDS.map(k => {
    const { pts, chief } = store.points[k.key];
    const nt = nextTier(pts);
    const pct = Math.max(0, Math.min(100, pts / maxPts * 100));
    const earnBtns = EARN.map(e =>
      `<button class="plus" data-k="${k.key}" data-d="${e.d}" data-c="0" data-l="${e.label}">${e.label} +${e.d}</button>`).join("");
    const spendBtns = SPEND.map(s =>
      `<button class="minus" data-k="${k.key}" data-d="-${s}" data-c="0" data-l="보상 ${s}점">-${s}</button>`).join("");
    const extraBtns = EXTRA.map(e =>
      `<button class="${e.cls}" data-k="${k.key}" data-d="${e.d}" data-c="0" data-l="${e.label}">${e.label} ${e.d > 0 ? "+" : ""}${e.d}</button>`).join("");
    return `
      <div class="kid${selected === k.key ? " sel" : ""}" data-kid="${k.key}" style="border-left-color:${k.color}">
        <div class="krow" data-toggle="${k.key}">
          <span class="kname">${k.name}</span>
          <span class="kpts">${pts}점</span>
        </div>
        <div class="kmeta">
          <span>대장 ${chief}회</span>
          <span class="nxt">${nt ? `${nt}점까지 ${nt - pts}점` : "모든 보상 달성"}</span>
        </div>
        <div class="kbar"><i style="width:${pct.toFixed(1)}%;background:${k.color}"></i></div>
        <div class="acts">
          <button class="chief" data-k="${k.key}" data-d="5" data-c="1" data-l="대장">대장 +5</button>
          ${earnBtns}
          <span class="lbl">그 밖의 가감</span>
          ${extraBtns}
          <span class="lbl">보상 사용 (점수 차감)</span>
          ${spendBtns}
        </div>
      </div>`;
  }).join("");

  const last = store.hist[store.hist.length - 1];
  LASTLINE.textContent = last
    ? `마지막 기록 · ${KIDS.find(k => k.key === last.k)?.name} ${last.l} ${last.d > 0 ? "+" : ""}${last.d}점`
    : "아직 기록이 없습니다";
  $("undo").disabled = !last;
  $("undo").style.opacity = last ? "1" : ".4";
}

function apply(kid, d, chiefInc, label){
  const p = store.points[kid];
  p.pts = Math.max(0, p.pts + d);
  p.chief = Math.max(0, p.chief + chiefInc);
  store.hist.push({ k: kid, d, c: chiefInc, l: label, t: Date.now() });
  if (store.hist.length > 30) store.hist = store.hist.slice(-30);
  persist(); renderKids();
  LIVE.textContent = `${KIDS.find(x => x.key === kid).name} ${label} ${d > 0 ? "+" : ""}${d}점, 현재 ${p.pts}점`;
}

KIDBOX.addEventListener("click", e => {
  const row = e.target.closest("[data-toggle]");
  if (row){ selected = selected === row.dataset.toggle ? null : row.dataset.toggle; renderKids(); return; }
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  apply(b.dataset.k, Number(b.dataset.d), Number(b.dataset.c), b.dataset.l);
});

$("undo").addEventListener("click", () => {
  const last = store.hist.pop();
  if (!last) return;
  const p = store.points[last.k];
  p.pts = Math.max(0, p.pts - last.d);
  p.chief = Math.max(0, p.chief - (last.c || 0));
  persist(); renderKids();
});

$("pwipe").addEventListener("click", () => {
  if (!confirm("모든 아이의 포인트와 대장 횟수를 0으로 되돌립니다. 계속할까요?")) return;
  store.points = blankPoints(); store.hist = [];
  persist(); renderKids();
});

/* ---------- 화면 ---------- */
function refreshLog(){
  let all = 0, done = 0;
  for (const m of ["day","night"])
    for (const r of Object.keys(DATA[m]))
      for (const c of DATA[m][r]){ all++; if (store.cities.includes(c)) done++; }
  CA.textContent = all; CD.textContent = done;
  BAR.style.width = (done / all * 100) + "%";

  const parts = store.cities.map(c => `<span class="chip">${c}</span>`)
    .concat(store.jeju.map(j => `<span class="chip j">${j}</span>`));
  CHIPS.innerHTML = parts.length ? parts.join("")
    : '<p class="empty">아직 없습니다. 여기에 쌓이는 도시는 다음 룰렛에서 빠집니다.</p>';

  JNOTE.textContent = freeJeju().length === 0
    ? "제주 특별전 6곳을 모두 다녀왔습니다"
    : jejuReady() ? `제주 특별전이 열려 있습니다 (${store.jeju.length} / 6)`
                  : `제주 특별전까지 ${toNextJeju()}곳 남았습니다 (${store.jeju.length} / 6)`;
  JBTN.className = jejuReady() && stage !== "jeju" ? "jeju show" : "jeju";
}

function marks(){
  [S1,S2,S3].forEach(el => el.className = "step");
  if (stage === "jeju"){ S3.className = "step jj"; S3.textContent = "제주 특별전"; return; }
  S3.textContent = "3 도시";
  if (stage === "dist"){ S1.className = "step on"; }
  else if (stage === "region"){ S1.className = "step did"; S2.className = "step on"; }
  else { S1.className = "step did"; S2.className = "step did"; S3.className = stage === "done" ? "step did" : "step on"; }
}

function paint(){
  const a = list(), n = a.length, C = hues();
  if (n === 0){ G.innerHTML = '<circle cx="200" cy="200" r="186" fill="#1B3A57"/>'; return; }
  if (n === 1){
    G.innerHTML = `<circle cx="200" cy="200" r="186" fill="${C[0]}" stroke="#0E1F33" stroke-width="3"/>` +
      `<text x="200" y="107" text-anchor="middle" font-family="Gothic A1, sans-serif" font-size="18" font-weight="700" fill="#0E1F33">${a[0]}</text>`;
    return;
  }
  const seg = 360 / n;
  let out = "";
  for (let i = 0; i < n; i++){
    const r0 = (i*seg - 90) * Math.PI/180, r1 = ((i+1)*seg - 90) * Math.PI/180;
    const x1 = 200 + 186*Math.cos(r0), y1 = 200 + 186*Math.sin(r0);
    const x2 = 200 + 186*Math.cos(r1), y2 = 200 + 186*Math.sin(r1);
    const big = seg > 180 ? 1 : 0;
    out += `<path d="M200 200 L${x1.toFixed(1)} ${y1.toFixed(1)} A186 186 0 ${big} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${C[i%6]}" stroke="#0E1F33" stroke-width="3"/>`;
    const m = ((i+0.5)*seg - 90) * Math.PI/180;
    const tx = 200 + 122*Math.cos(m), ty = 200 + 122*Math.sin(m);
    const fs = a[i].length > 4 ? 16 : 19;
    out += `<text x="${tx.toFixed(1)}" y="${(ty+6).toFixed(1)}" text-anchor="middle" font-family="Gothic A1, sans-serif" font-size="${fs}" font-weight="700" fill="#0E1F33">${a[i]}</text>`;
  }
  G.innerHTML = out;
}

function show(text, hint){
  OUT.textContent = text;
  OUT.classList.remove("pop"); void OUT.offsetWidth; OUT.classList.add("pop");
  HINT.innerHTML = hint;
  LIVE.textContent = text + ". " + hint.replace(/<[^>]+>/g, " ");
}
function zero(){
  G.style.transition = "none"; G.style.transform = "rotate(0deg)"; turn = 0;
  setTimeout(() => { G.style.transition = ""; }, 40);
}

function toStart(msg){
  stage = "dist"; mode = ""; region = "";
  marks(); zero(); paint(); refreshLog();
  GO.textContent = "돌리기";
  if (freeModes().length === 0){
    GO.disabled = true; OUT.textContent = "전국 완주";
    HINT.innerHTML = "67곳을 모두 다녀왔습니다";
  } else {
    GO.disabled = false; OUT.textContent = "준비 완료";
    HINT.textContent = msg || "지난주 대장이 거리를 돌립니다";
  }
}

function jumpTo(m){
  if (spinning) return;
  if (liveRegions(m).length === 0){ show("완주", LABEL[m] + " 도시는 모두 다녀왔습니다"); return; }
  mode = m; stage = "region";
  marks(); zero(); paint(); refreshLog();
  GO.disabled = false; GO.textContent = "권역 뽑기";
  show(LABEL[m], "거리를 직접 정했습니다");
}

/* ---------- 조작 ---------- */
JBTN.addEventListener("click", () => {
  if (spinning || !jejuReady()) return;
  stage = "jeju"; mode = ""; region = "";
  marks(); zero(); paint(); refreshLog();
  GO.disabled = false; GO.textContent = "제주 뽑기";
  show("제주 특별전", "10곳 달성 보너스입니다");
});

GO.addEventListener("click", () => {
  if (spinning) return;
  if (stage === "done"){ toStart("다음 목적지를 뽑으세요"); return; }
  const a = list(), n = a.length;
  if (n === 0) return;
  const seg = 360 / n, win = Math.floor(Math.random() * n);
  const land = (((-(win + 0.5) * seg) % 360) + 360) % 360;
  turn += 1800 + land - (turn % 360);
  spinning = true; GO.disabled = true;
  OUT.textContent = "돌아가는 중"; HINT.textContent = "";
  G.style.transform = `rotate(${turn}deg)`;

  setTimeout(() => {
    spinning = false; GO.disabled = false;
    if (stage === "jeju"){
      const spot = a[win];
      if (!store.jeju.includes(spot)){ store.jeju.push(spot); persist(); }
      show(spot, "제주 특별전 목적지입니다");
      stage = "done"; marks(); refreshLog(); GO.textContent = "다음 판 준비";
    } else if (stage === "dist"){
      mode = freeModes()[win];
      show(LABEL[mode], "이제 권역을 뽑습니다");
      stage = "region"; marks(); zero(); paint(); GO.textContent = "권역 뽑기";
    } else if (stage === "region"){
      region = a[win];
      if (!store.regions.includes(region)){ store.regions.push(region); persist(); }
      show(region, "이 안에서 도시를 뽑습니다");
      stage = "city"; marks(); zero(); paint(); GO.textContent = "도시 뽑기";
    } else {
      const city = a[win];
      if (!store.cities.includes(city)){ store.cities.push(city); persist(); }
      stage = "done"; marks(); refreshLog();
      const tail = jejuReady() ? "제주 특별전이 열렸습니다" : `다음 제주 특별전까지 ${toNextJeju()}곳`;
      show(city, `${LABEL[mode]} · ${region}<br>${tail}`);
      GO.textContent = "다음 판 준비";
    }
  }, 4700);
});

$("rst").addEventListener("click", () => { if (!spinning) toStart("지난주 대장이 거리를 돌립니다"); });
$("fDay").addEventListener("click", () => jumpTo("day"));
$("fNight").addEventListener("click", () => jumpTo("night"));
$("wipe").addEventListener("click", () => {
  if (spinning) return;
  if (!confirm("다녀온 곳 기록을 모두 지웁니다. 모든 기기에서 함께 사라집니다. 계속할까요?")) return;
  store.cities = []; store.regions = []; store.jeju = [];
  persist(); toStart("기록을 지웠습니다");
});

/* ---------- 탭 ---------- */
function tab(which){
  const w = which === "wheel";
  $("tWheel").setAttribute("aria-selected", w);
  $("tPoints").setAttribute("aria-selected", !w);
  $("vWheel").className  = "view" + (w ? " on" : "");
  $("vPoints").className = "view" + (w ? "" : " on");
  if (!w) renderKids();
}
$("tWheel").addEventListener("click", () => tab("wheel"));
$("tPoints").addEventListener("click", () => tab("points"));

/* ---------- 시작 ---------- */
cacheRead();
renderKids();
toStart("불러오는 중");

const clean = u => u.replace(/\/rest\/v1\/?$/, "").replace(/\/+$/, "");
const ready = !SUPABASE_URL.startsWith("여기에") && !SUPABASE_KEY.startsWith("여기에");

if (!ready){
  setSync("off", "설정 전 — 이 기기에만 저장됩니다");
  toStart("지난주 대장이 거리를 돌립니다");
} else {
  sb = createClient(clean(SUPABASE_URL), SUPABASE_KEY);
  const ok = await pull();
  renderKids();
  toStart("지난주 대장이 거리를 돌립니다");
  if (ok){
    sb.channel("rosanko-live")
      .on("postgres_changes",
        { event: "*", schema: "public", table: "rosanko_state", filter: `id=eq.${FAMILY_ID}` },
        payload => {
          if (!payload.new || spinning) return;
          adopt(payload.new); cacheWrite();
          refreshLog(); renderKids();
          if (stage === "dist") paint();
        })
      .subscribe();
  }
}
</script>
</body>
</html>
